name = "ecor-contact-notify"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
# Domain được phép gọi Worker (CORS)
ALLOWED_ORIGIN = "https://ecor.vn"

# SMTP Google Workspace (đăng nhập bằng contact@ecor.vn)
SMTP_HOST = "smtp.gmail.com"
SMTP_PORT = "465"
SMTP_SECURE = "true"
# Thư gửi cho khách hàng
MAIL_FROM_CUSTOMER = "contact@ecor.vn"
# Thư hệ thống (thông báo nội bộ có lead mới)
MAIL_FROM_SYSTEM = "no-reply@ecor.vn"
# Hộp thư nhận thông báo lead mới
MAIL_TO = "contact@ecor.vn"

# Secret KHÔNG khai báo ở đây, set bằng lệnh (xem README.md):
#   wrangler secret put SMTP_USER
#   wrangler secret put SMTP_PASS
