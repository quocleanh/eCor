<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Chuyển Khoản Thông Minh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #22c55e;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      text-align: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    h2 {
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 24px;
      color: var(--text-main);
      font-size: 1.5rem;
    }

    .qr-wrapper {
      background: white;
      padding: 15px;
      border-radius: 16px;
      display: inline-block;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }

    img#qr {
      width: 250px;
      height: 250px;
      display: block;
      transition: transform 0.3s ease;
    }

    img#qr:hover {
      transform: scale(1.02);
    }

    .quick-amount-buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .quick-btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      background: white;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .quick-btn:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px -1px rgba(99, 102, 241, 0.3);
    }

    .quick-btn.active {
      background: var(--primary);
      color: white;
    }

    .info {
      background: rgba(0, 0, 0, 0.02);
      padding: 20px;
      border-radius: 16px;
      text-align: left;
    }

    .info p {
      margin-bottom: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .info p:last-child {
      margin-bottom: 0;
    }

    .info span {
      display: block;
      font-weight: 600;
      color: var(--text-main);
      font-size: 1.1rem;
    }

    .amount {
      color: var(--success) !important;
    }

    /* Settings Button */
    .settings-trigger {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.2s;
    }

    .settings-trigger:hover {
      background: #f1f5f9;
      transform: rotate(45deg);
    }

    /* Modal / Panel */
    .settings-panel {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .settings-panel.active {
      display: flex;
    }

    .settings-content {
      background: white;
      padding: 32px;
      border-radius: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .settings-content h3 {
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn-save {
      background: var(--primary);
      color: white;
    }

    .btn-cancel {
      background: #f1f5f9;
      color: var(--text-muted);
    }

    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="container">
  <button class="settings-trigger" onclick="toggleSettings()" title="Cài đặt">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v6m4.22-4.22l-4.24 4.24m5.08 4.22h-6m4.22 4.22l-4.24-4.24m5.08 4.22v6m4.22 4.22l-4.24-4.24m-4.22-5.08h6m-4.22-4.22l-4.24 4.24m-5.08-4.22v-6m-4.22-4.22l4.24 4.24m-5.08 4.22h6m-4.22 4.22l4.24-4.24"></path></svg>
  </button>

  <h2>QR Chuyển Khoản</h2>

  <div class="qr-wrapper">
    <img id="qr" src="" alt="QR Code">
  </div>

  <div class="quick-amount-buttons">
    <button class="quick-btn" onclick="setQuickAmount(25000)">25K</button>
    <button class="quick-btn active" onclick="setQuickAmount(50000)">50K</button>
  </div>

  <div class="info">
    <p>Số tiền: <span class="amount" id="display-amount"></span></p>
    <p>Nội dung: <span id="display-content"></span></p>
    <p>Ngân hàng: <span id="display-bank"></span></p>
    <p>Số tài khoản: <span id="display-account"></span></p>
  </div>
</div>

<!-- Settings Panel -->
<div id="settings-panel" class="settings-panel">
  <div class="settings-content">
    <h3>Cài đặt mã QR</h3>
    <div class="form-group">
      <label>Ngân hàng (Ví dụ: ACB, VCB, MB)</label>
      <input type="text" id="input-bank">
    </div>
    <div class="form-group">
      <label>Số tài khoản</label>
      <input type="text" id="input-account">
    </div>
    <div class="form-group">
      <label>Số tiền (VNĐ)</label>
      <input type="number" id="input-amount">
    </div>
    <div class="form-group">
      <label>Template nội dung gửi</label>
      <input type="text" id="input-sender">
    </div>
    <div class="actions">
      <button class="btn btn-cancel" onclick="toggleSettings()">Hủy</button>
      <button class="btn btn-save" onclick="saveSettings()">Cập nhật QR</button>
    </div>
  </div>
</div>

<script>
  // ===== CONFIG MẶC ĐỊNH =====
  const DEFAULT_CONFIG = {
    bank: "ACB",
    account: "24592357",
    amount: 50000,
    sender: "Le Anh Quoc chuyen tien "
  };

  // State
  let currentConfig = { ...DEFAULT_CONFIG };

  // Load from LocalStorage if exists
  const saved = localStorage.getItem('qr_config');
  if (saved) {
    try {
      currentConfig = JSON.parse(saved);
    } catch (e) {
      console.error("Lỗi đọc config:", e);
    }
  }

  // ===== UI FUNCTIONS =====
  function toggleSettings() {
    const panel = document.getElementById('settings-panel');
    panel.classList.toggle('active');
    
    if (panel.classList.contains('active')) {
      document.getElementById('input-bank').value = currentConfig.bank;
      document.getElementById('input-account').value = currentConfig.account;
      document.getElementById('input-amount').value = currentConfig.amount;
      document.getElementById('input-sender').value = currentConfig.sender;
    }
  }

  function setQuickAmount(amount) {
    currentConfig.amount = amount;
    localStorage.setItem('qr_config', JSON.stringify(currentConfig));
    generateQR();
    updateQuickButtonStates();
  }

  function updateQuickButtonStates() {
    const buttons = document.querySelectorAll('.quick-btn');
    buttons.forEach(btn => {
      btn.classList.remove('active');
      if (parseInt(btn.textContent) * 1000 === currentConfig.amount) {
        btn.classList.add('active');
      }
    });
  }

  function saveSettings() {
    currentConfig.bank = document.getElementById('input-bank').value || DEFAULT_CONFIG.bank;
    currentConfig.account = document.getElementById('input-account').value || DEFAULT_CONFIG.account;
    currentConfig.amount = parseInt(document.getElementById('input-amount').value) || 0;
    currentConfig.sender = document.getElementById('input-sender').value || DEFAULT_CONFIG.sender;

    localStorage.setItem('qr_config', JSON.stringify(currentConfig));
    generateQR();
    updateQuickButtonStates();
    toggleSettings();
  }

  // ===== LOGIC CHÍNH =====
  function getTodayContent(senderTemplate) {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    return senderTemplate + day + month;
  }

  function generateQR() {
    const fullContent = getTodayContent(currentConfig.sender);
    const bankStr = currentConfig.bank;
    const accStr = currentConfig.account;
    const amountVal = currentConfig.amount;

    // VietQR API
    const url = `https://api.vietqr.io/image/${bankStr}-${accStr}-compact.png?amount=${amountVal}&addInfo=${encodeURIComponent(fullContent)}`;

    // Render to UI
    document.getElementById("qr").src = url;
    document.getElementById("display-content").innerText = fullContent;
    document.getElementById("display-amount").innerText = amountVal.toLocaleString() + " VND";
    document.getElementById("display-bank").innerText = bankStr;
    document.getElementById("display-account").innerText = accStr;
  }

  // ===== TỰ ĐỘNG LÀM MỚI KHI QUA NGÀY MỚI =====
  function refreshAtMidnight() {
    const now = new Date();
    const night = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
    const msToMidnight = night.getTime() - now.getTime();

    setTimeout(() => {
      generateQR();
      refreshAtMidnight();
    }, msToMidnight);
  }

  // ===== INIT =====
  generateQR();
  updateQuickButtonStates();
  refreshAtMidnight();
</script>

</body>
</html>
